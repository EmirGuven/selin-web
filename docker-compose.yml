services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selin-web
    restart: unless-stopped

    # Traefik yönlendirmesi
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
    
      - "traefik.http.routers.selin-web.rule=Host(`klinikpsikologselinasyabagci.com`) || Host(`www.klinikpsikologselinasyabagci.com`)"
      - "traefik.http.routers.selin-web.entrypoints=web"
      - "traefik.http.routers.selin-web.service=selin-web"
    
      - "traefik.http.routers.selin-web-secure.rule=Host(`klinikpsikologselinasyabagci.com`) || Host(`www.klinikpsikologselinasyabagci.com`)"
      - "traefik.http.routers.selin-web-secure.entrypoints=websecure"
      - "traefik.http.routers.selin-web-secure.tls=true"
      - "traefik.http.routers.selin-web-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.selin-web-secure.service=selin-web"
    
      - "traefik.http.services.selin-web.loadbalancer.server.port=3000"

    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      UPLOADS_DIR: /app/public/uploads
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_use_strong_secret}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://klinikpsikologselinasyabagci.com}

    volumes:
      - type: bind
        source: ${APP_DATA_DIR:-/data/selin-web/db}
        target: /app/data-db
        bind:
          create_host_path: false
      - type: bind
        source: ${APP_UPLOADS_DIR:-/data/selin-web/uploads}
        target: /app/public/uploads
        bind:
          create_host_path: false

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{if(r.ok)process.exit(0);else process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - proxy

networks:
  proxy:
    external: true
